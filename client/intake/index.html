on to person. Dr. Al-Deek will review your health history to determine whether a GLP-1 is appropriate for you, and if so, which medication and dose.`],defaultOpen:!0},{title:`Possible side effects`,paragraphs:[`Most side effects are digestive and tend to be strongest when starting treatment or increasing your dose. They can include nausea, vomiting, diarrhea, constipation, bloating, heartburn, stomach pain, reduced appetite, fatigue, headache, dizziness, and redness or irritation at the injection site. Staying hydrated, eating smaller meals, and increasing your dose gradually can help. Tell your doctor if side effects are severe or don't improve.`],defaultOpen:!1},{title:`Serious risks`,paragraphs:[`Although uncommon, GLP-1 medications can cause serious problems. Stop the medication and seek medical care right away if you experience:`,`In animal studies, some GLP-1 medications caused thyroid C-cell tumors. It is not known whether this happens in people. GLP-1 medications should not be used if you or a family member has had medullary thyroid cancer (MTC) or Multiple Endocrine Neoplasia syndrome type 2 (MEN2). Tell your doctor about any lump or swelling in your neck, trouble swallowing, or persistent hoarseness.`,`If you have a medical emergency, call 911.`],bullets:[`Severe stomach pain that doesn't go away, with or without vomiting (possible pancreatitis)`,`Pain in the upper right abdomen, fever, yellowing of the skin or eyes, or clay-colored stools (possible gallbladder problems)`,`Signs of a serious allergic reaction, such as swelling of the face, lips, tongue, or throat, difficulty breathing, or a severe rash`,`Signs of low blood sugar, such as shakiness, sweating, confusion, or a fast heartbeat - especially if you also take insulin or a sulfonylurea`,`Decreased urination or signs of dehydration from ongoing vomiting or diarrhea, which can affect kidney function`,`Changes in vision, if you have diabetes`,`New or worsening depression, unusual changes in mood, or thoughts of self-harm`],defaultOpen:!1},{title:`Pregnancy, birth control, and procedures`,paragraphs:[`GLP-1 medications should not be used during pregnancy or while breastfeeding. If you are planning to become pregnant, talk with your doctor - some medications need to be stopped at least two months before trying to conceive. Some GLP-1 medications can make birth control pills less effective, particularly after starting or increasing a dose; your doctor may recommend a backup method. Because these medications slow digestion, tell any surgeon or anesthesia provider that you take a GLP-1 before any procedure that requires sedation or anesthesia.`],defaultOpen:!0},{title:`Compounded medications`,paragraphs:[`If a compounded medication is recommended, it is prepared by a licensed pharmacy based on your prescription. Compounded medications are not FDA-approved, which means the FDA has not reviewed them for safety, effectiveness, or quality in the same way as brand-name medications. Your doctor can explain the differences between compounded and brand-name options and help you choose what's right for you.`],defaultOpen:!0},{title:`Treatment expectations`,paragraphs:[`Medication is one part of your care. Dr. Al-Deek may recommend nutrition, activity, and lifestyle changes, regular check-ins, and dose adjustments based on how you respond. Weight may return if the medication is stopped. GLP-1 medications are intended for ongoing use under medical supervision - do not change your dose or share your medication with anyone else.`],defaultOpen:!0},{title:`Your responsibilities`,paragraphs:[`To keep your treatment safe, you agree to: provide complete and accurate health information, including all medications and supplements; report side effects or changes in your health promptly; let us know if you become pregnant; and complete follow-up check-ins when requested.`],defaultOpen:!0},{title:`Telehealth care`,paragraphs:[`Your care is provided through telehealth. Your doctor will rely
